  comment: "↑のまさにキャンプ本。うー、タヌキとか一度食べてみたいなあ。囲炉履のある家っていいなあ。"
- 1999/01/09: 「<a href="https://www.amazon.co.jp/dp/4101429227/">オーケンののほほんと熱い国へ行く</a>」、大槻 ケンヂ、新潮文庫
  comment: "「行きそで行かないところに行こう」でなんとなく体が大槻ケンヂになったので続けて読破。「行きそで行かないところに行こう」は国内中心でしたが、本書はインド、タイへの旅行記です。聞けば聞くほどインドって変な国ですな。一度行きたいもんだ。"
- 1999/01/07: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4101429219">行きそで行かないとこへ行こう</a>」、大槻 ケンヂ、新潮文庫
  comment: |-
    大槻ケンヂの文章は実に読みやすくてさらっと読み切れちゃうのがいいですね。自分が住んでたからかもしれませんが、大阪編が面白かった。大阪って妙な街だと再認識させられます。
    さて、本書の一番面白いのは実は本文ではなく解説です。カレーの話を延々と書いてるのですが、何度か声を出して笑ってしまいました。解説でこんなに笑ったのは初めてではなかろうか。田中哲弥の作品の解説も面白いけど、あれは本人が解説してるのでちとズルい。解説だけでも読む価値あり。
- 1999/01/05: 「タラパティ 〜踊るゴッドファーザー」
  comment: |-
    インド映画です。ムトゥ人気にあやかったこのサブタイトルどうにかならんかあ……。
    今回はスーパースター・ラジニがマフィアの首領です。悪役です。色んな奴を殴りまくり、蹴りまくります。でも、対立する市長と実は兄弟だっという実に分かりやすいお話し。編集のつぎ目とか踊りとかあまりにも普通なので、「違う！俺がインド映画に求めているのはこれではない！」と見てました。
- 1999/01/05: 「<a href="https://www.amazon.co.jp/dp/B00005FXB7/">serial experiments lain lif.04</a>」、中村隆太郎/Project 2nd.
  comment: もー、忘れちゃった。後半はだんだん印象が薄くなってくるなあ。
- 1999/01/04: 「<a href="https://www.amazon.co.jp/dp/4101386110/">霧越邸殺人事件</a>」、綾辻 行人、新潮文庫
  comment: 幻想たっぷりの舞台に、論理的なストーリー、さらに彩りを添えるメタな遊び。綾辻行人の集大成って感じですな。
