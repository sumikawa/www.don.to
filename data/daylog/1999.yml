- 1999/04/14: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4257768061">機械(メタルダム)どもの荒野</a>」、森岡 浩之、ソノラマ文庫
  comment: |-
    1997年発売だって。知らないうちに出てた。森岡ファンとしては悔しい。
    彼の作品を読んでて思うのは、構成力と文章力は十二分にあるが、発想力はさほど高くないということ。話そのものはかなりオーソドックで、突飛なストーリーや誰もが思いつかない結末などはありません。しかし、登場キャラクターの描写が実に見事でついついノメり込んでしまいます。それが魅力ですね。
    内容は人間対機械のよくあるSF。後半はいささか単調かな。後から出版された割には「星海の紋章」よりも洗練されてない印象を受けました。とってもデビュー作っぽい。実際には違うんだけど。
- 1999/04/12: "「御先祖様万々万歳」、押井守"
  comment: 久しぶりに見ました。大学以来だな。押井守のエキスが全部出てます。出尽くしてます。DVD出ないかなあ、絶対買うのに。
- 1999/04/11: 「星海の紋章」、WOWWOW
  comment: |-
    WOWOWアニメ版。1話から13(最終)話までを通して見ました。原作の最大の目的はヒロインであるラフィールを生き生きと描写することに尽きるので、そういう意味ではまあ良く出来ていると思います。
    スペースオペラ小説のアニメ化と捉えると40点くらい。まあ、漢字だらけの原作を映像化するのは大変だったと思いますけど、「翔士修技生(しょうししゅうぎせい)」なんていきなり言われても、原作読んでない視聴者には絶対分からんぞ。あと、ラストはしょり過ぎ。尻切れトンボになってます。
    さて、今回のアニメ化に際して、ハヤカワはちょろっと短篇の載った「星界の紋章ハンドブック」を発売したり、初期短篇集を単行本で出版したりしてます(「星海の紋章」自身は文庫で発売してるくせに)。僕はこういう商業主義は大嫌いです。こんな商売の仕方で儲かったりすると、性懲りもなく繰り返すので、よいこのみんなは買っちゃだめだよ。
- 1999/03/20: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4102179119">魔術師の物語</a>」、デイヴィッド ハント、新潮社
  comment: |-
    ファンタジーと思って買ったら、ミステリーものでした。内容は70点くらいかな。物語が完結してからぐだぐだと事後談が続くのは、アメリカ小説で時々見かけますが、この手法は好みじゃない。やっぱり物語はスパッと終らなきゃね。
