  comment: ファンタジーと思って買ったら、ミステリーものでした。内容は70点くらいかな。物語が完結してからぐだぐだと事後談が続くのは、アメリカ小説で時々見かけますが、この手法は好みじゃない。やっぱり物語はスパッと終らなきゃね。
- 1999/03/13: 「<a href="https://www.imdb.com/title/tt0120812/">ラッシュアワー</a>」
  comment: シカゴ行きの飛行機で上映してた。爆睡のため途中からしか観てないので、内容についてのコメントは控えますが、香港映画とハリウッド映画の見事な融合という感じがしました。香港風のアクションと、ハリウッド流のアップテンポで軽快なノリ。素晴らしい。さあ、日本映画はどうやってハリウッドに融けこんでいくのだろう。「コンタクト」や「トルーマン・ショー」で描写されてる日本人を見てると、道は険しそうです。
- 1999/03/07: 「<a href="https://www.amazon.co.jp/dp/4829128356/">ミュートスノート戦記 道標なき戦野の咆吼</a>」、麻生 俊平、富士見ファンタジア文庫
  comment: 二つ下の「戦士の掟は炎で刻め」の2巻目。タイトルくさい。以上、終り。
- 1999/03/04: 「低俗霊狩り <a href="http://www.amazon.co.jp/exec/obidos/ASIN/4091932118">上</a>/<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4091932126">下</a>」、奥瀬 サキ、小学館文庫
  comment: |-
    漫画文庫で再販したので購入。発売直後に買わなかったので探すの大変でした。どうせ数売れないから再刷してないだろうし。中身は、新書館版全三巻 - 未完の「自動人形」の章 + 短篇4つとなってます。短篇が良かったので購入して正解。また連載再開してくれないかなあ。「自動人形」ってどうなったんだろう、ウイングスかどっかで一瞬、再開してたような気がしたけど、結局、途中まで？
    と、思ってクリックしてたら<a href="http://www.lares.dti.ne.jp/~sakki-/rooms/okuse.html">情報</a>ありました。ヤングアニマル増刊かあ。やっぱ未完なのね。
- 1999/03/03: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/482912816X">ミュートスノート戦記 戦士の掟は炎で刻め</a>」、麻生 俊平、富士見書房
  comment: |-
    友人に勧められて読みましたが、駄目だあ。会話がやたらと説明くさい。台詞がクサくなるときがしょっちゅう。狙ってるわけでは決してない。キャラの行動がどうも不自然。たぶん、人物描写の書き込みが足りない。著者の主義主張が表に出すぎ。デビュー直後ならこういう作品は仕方なくて、5〜6冊書いたら肩の力が抜けていい感じになるんだけど、この人、富士見だけで12冊も書いてるやん。よくなるとは思えん。
- 1999/02/22: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/407310781X">やみなべの陰謀</a>」、田中 哲弥、電撃文庫
  comment: |-
    気がついたら新刊が出てた。大久保町シリーズと本作の間に翻訳物も手掛けていたのね(「悪魔の国からこっちに丁稚 上/下」)。探さねば。
    さて、本作はジャンルの違う短篇5作が実に巧妙に絡み合わさり、壮大な構想に基づいた一つの長編を構成する、と本人がふざけて書いた解説に書いてあります。相変わらず肩の力の抜け切ったとぼけた文体が素晴らしい。大好きです。
- 1999/02/13: 「<a href="https://www.amazon.co.jp/dp/4101410119/">南の川まで</a>」、野田 知佑、新潮社
  comment: 野田さんのハードボイルドな野外生活に憧れて読んでますが、最近の作品は日本の自然が壊されていくことの愚痴ばかりがふえて来てます。悲しいですね。
- 1999/02/07: 「<a href="http://www.trumanshow.com/">Truman Show</a>」
  comment: |-
    ジム・キャリー扮する保険会社に勤める平凡なサラリーマンが、実はトルーマン・ショーなる人気番組のスターだという話。街は実は巨大なセットで、本人以外の住民全員が役者で、知らぬは本人ばかりなり。
    これ、コメディかあ？ テーマ重すぎ。面白いことは面白いけど何か一味足りないような気がする。押井守に監督やらしたら面白かったかも。全然違う作品になると思うけど。
