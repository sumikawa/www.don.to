---
- 1998/12/29: 「<a href="https://www.amazon.co.jp/dp/4062638355/">暗闇の囁き</a>」、綾辻 行人、講談社文庫
  comment: 前作「緋色の囁き」と同じく、バランスの悪さが気になりました。うーむ、綾辻さんもそろそろ飽きてきたか?
- 1998/12/22: 「<a href="https://www.amazon.co.jp/dp/4044155089/">いかづちの剣〈2〉</a>」、小林 めぐみ、角川スニーカー文庫
  comment: |-
    「ねこたま」、「まさかな」と素晴らしい作品を提供していた小林めぐみですが、「極東少年」以後、駄作を量産するようになりました。あとがきから察するに、もっと読みやすい文章をという編集者の言いなりに文章を書き直させられたせいで、彼女の個性がどんどん薄められていったように思います。
    本作は、デビュー当時のクオリティに戻ったとはまだ言えませんが、復調の兆しが感じられます。頑張って下さい、応援してます。
- 1998/12/21: 「<a href="https://www.amazon.co.jp/dp/4257767456/">キマイラ縁生変</a>」、夢枕 獏、ソノラマ文庫
  comment: 昔の話が続いていてあまり燃えませんでした。はやく現代に戻らないかなあ。
- 1998/12/20: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4167609010">新宿歌舞伎町 マフィアの棲む街</a>」、吾妻 博勝、文春文庫
  comment: |-
    「日本人には悪いが、歌舞伎町はもう日本じゃない」という一文におおっと来ました。本書は映画にもなった馳星周の「不夜城」の元ネタの一つ。歌舞伎町に棲む様々な国のマフィアたちを取材したノンフィクションです。時々、自慢気な文体が気に障りますが、一読の価値あり。
- 1998/12/19: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4150305951">タイム・リーパー</a>」、大原 まり子、ハヤカワ文庫
  comment: |-
    素晴らしい。大原まり子の小説はすぐブッ飛んでしまって、常人には理解できなくなってしまうことが多いんですが、本作は最後までほどよく制御されています。内容はよくあるタイムスリップのSFなんですが、構成、展開が素晴らしい。無駄なキャラクター、台詞は一つもなく、どれもが後で重要な意味を持って来ます。高得点あげます。
- 1998/12/19: 「<a href="https://www.amazon.co.jp/dp/4150305943/">たまご猫</a>」、皆川 博子、ハヤカワ文庫
  comment: 短篇集です。幻想小説というのかな、ちょっと恐い感じの小品が並んでいます。文章がうまいですね、特に「春の滅び」がよかった。
- 1998/12/06: 「機動戦士ガンダム LDBOX 上巻」
  comment: |-
    友人と共同購入。LDは持ってないのでビデオに落して回してもらう。ああ、もう懐かしすぎる。ガルマ様、どうして死んだの？ 坊やだからさ。グフかっこいー。ランバ・ラルかっこいー。ギレン渋いー。
- 1998/12/04: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4480034285">翻訳家という楽天家たち</a>」、青山 南、ちくま文庫
  comment: |-
    最近、ビデオとDVDにかまけてて全然小説読んでません。読みかけの本は山程あるんだけど。で、久しぶりに読了の本書は主にアメリカ文学を翻訳してる著者のエッセイ。アメリカの作家や文化に対する愛情がひしひしと伝わってきますが、山程でてくるカタカナの名前が全然、分かりません。まあ、雰囲気だけ感じることにしました。一番、気にいったのはこのくだり。「どうしても訳せない文章があったら飛ばしてしまえ」。そうだったんか！ 目からウロコ。
- 1998/11/26: 「<a href="https://www.amazon.co.jp/dp/B00005NJUZ/">スタンド・バイ・ミー</a>」
  comment: レンタルDVD第二段。内容は今更説明するまでもないと思うので省略。そこそこ楽しめましたが、なぜこれが名作と呼ばれてるのか分からんかった。普通やん。
- 1998/11/14: 「ムトゥ 〜踊るマハラジャ〜」
  comment: |-
    何故か2週連続で観に行ってしまいました。もはや中毒ですな。今回は1時間半前から並んで前から2列目に座りました。前回よりも上映時間が短く感じたのが不思議でした。3時間ずーっと、ムトゥばりの半笑いで観てたような気がする。
- 1998/10/31: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/B00006C1W0">うる星やつら2 ビューティフル・ドリーマー</a>」、押井守
  comment: |-
    久しぶりにレンタルビデオで借りて来ました。最初に見た小学生の頃から数えると10回は超してると思う。敬愛してやまない押井守の最高傑作。人生で最も数多く見てる映画です。何回見ても本当にいいなあ。DVD出ないかなあ。オンリー・ユーとかリメンバー・マイ・ラブとか他作品はどうでもいい。これだけでいい。
- 1998/10/29: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4043442017">不夜城</a>」、馳 星周、角川文庫
  comment: |-
    久しぶりに本屋で見かけた知らない作家に手を出しましたが、正解でした。新宿を舞台にしたハードボイルドですが、めっちゃ渋いです。お勧め。他に文庫化された作品はまだないみたいなので、文庫化が待ち遠しい作家に一人になりました。特に最後がよかった。やっぱこうでなくっちゃね。
- 1998/10/19: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/408618057X">ソムリエ (1)</a>」、城 アラキ,甲斐谷 忍・堀 賢一、集英社
  comment: |-
    タイトル通り、ソムリエが主人公の漫画です。漫画喫茶でフランス編(1〜3巻)を読んだら結構面白かったので、本屋で続きを購入したらやられました。4巻の日本編から急に「美味しんぼ」ノリになって全然面白くねえでやんの。金返せ。
- 1998/10/13: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/B00005EDRW">HANA-BI</a>」、北野武、バンダイビジュアル
  comment: |-
    全体的に静かな色調の中で物語がハードに進んで行く、北野武お得意のパターンです。北野作品の一つの完成形だと思いますが、処女作「その男、凶暴につき」を超えてないと思う。「もののけ姫」と「風の谷のナウシカ」の関係に近い。
- 1998/10/12: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/B00005FXB4">serial experiments lain lif.01</a>」、Producion 2nd
  comment: |-
    もともと深夜放送でやっていたものがビデオになったので借りて来ました。まだ2話分なので評価はできませんが、変わった雰囲気をもったアニメです。実験的手法っていうのかな。実写だと深夜放送でときどき見掛けます。例えば、NIGHT HEADとか。また、OAVならアニメでもこういう内容のものはあります。でも、アニメで、かつテレビ放送という組合せは画期的だと思います。こういうアニメにテレビ局が金を出すというのは素晴らしいですね。いい世の中になったもんだ。
- 1998/10/11: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/B0000V4O38">PERFECT BLUE</a>」
  comment: |-
    ちょっと前に話題になってたアニメ。派手に宣伝やってたのでとりあえず見てみました(踊らされてる)。基本的にはアイドルとそのストーカーというよくある話。途中から押井守ノリになって訳分かんなくなりますが、最後はちゃんと締めてくれました。
    ラストは画面からの情報を信じてると納得いかない部分もありますが、エヴァンゲリオンと同じで登場人物の幻覚が入って来るので、画面からの情報を素直に信じる訳にはいかなくて、最後は感覚的に理解するしかないのでこんなもんでしょう。結構おもしろかったです。
- 1998/10/04: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4094600647">夢枕獏の外道教養文庫</a>」、夢枕 獏、小学館ライブラリー
  comment: |-
    ビッグコミックに連載してたエッセイをまとめたものです。自分の収入は幾らで、そのうち幾らが税金に取られているかを赤裸々に語ってくれます。そこは面白かったけど、残りは今イチ。
- 1998/10/03:「<a href="https://www.amazon.co.jp/dp/4396204310/">鬼去来〈2〉</a>」、菊地 秀行、祥伝社
- 1998/10/03:「<a href="https://www.amazon.co.jp/dp/4396204086/">鬼去来〈1〉</a>」、菊地 秀行、祥伝社
- 1998/09/27: 「NEONGENESIS EVANGERION GENESIS 0:14」、GAINAX
  comment: |-
    ようやくVHS/LDがすべて出そろいました。お疲れさまでしたって感じですね。今回はレンタルで済ましましたが、DVDが出れば購入する予定です。
    映画館に三度足を運んだ私としてはもう内容についてとやかく言いません。理屈ではなくて、感覚でだけど、自分なりにすべて理解したつもりでいるし。でも、改めて観てるとやっぱり色々自分のことを考えてしまいますね。そういう意味でやっぱり、すごい物語だったんだなあと思います。他にもあるかも知れませんが、僕が気が付いた限りでは映画版と比較すると2箇所の修正が入ってました。1つ目はリビングルームのシーンで「——イヤ。」っていう字幕。「(無言)」と対を成そうと思ったのかな？ 2つ目は「終劇」が「完」になってこと。「終劇」の方が好きだったんだけど。
- 1998/09/25: 「超完全 詐欺マニュアル」、吉田雄亮、勁文社
  comment: |-
    法律勉強シリーズその3。この人の文章嫌い。Hot Dog系の文章の書き方とでもいいましょうか。「〜だぜ」みたいな慣々しい文章。どっかで聞いたような詐欺の話を適当に並べたような話。内容もそんなに深いこともないし、ちゃんと調べないで伝聞系のまま済ましていることもある。薄っぺらい内容から、ちょっとした雑学を拾うぐらしか出来ませんでした。なかなかいい法律書に出会えません。
- 1998/09/24: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4150306036">星界の戦旗〈2〉守るべきもの</a>」、森岡 浩之、ハヤカワ文庫
  comment: |-
    待ってました！ 久々に続刊がでました。寝つけなかったせいもあってAM 5:00までかかって読破しちゃいました(ゆっくり読んだのは、面白い証拠)。さらにいうと、この文章を書いてるのは27日なんですが、もう2回目読んじゃったもんね。
    この本はSFなんですが、ストーリが緻密だとか設定が壮大だとか、そういう面白さではなくて、単にヒロインが可愛いのです。いや、無論、設定はしっかりしてますし、文章も上手いし、話もよく出来てますが、そういうのを超越してラフィールが可愛いのです。はい。ということで、本書はもとより、ハヤカワ文庫で出ている「星界の紋章」「星界の戦旗」のシリーズは本当におすすめです。是非購入ください。
    僕の中ではこの2〜3年の一番のヒット作品です。ちなみに、来年からWOWOWでアニメ化されます。
- 1998/09/19: 「THE CHANCE」
  comment: |-
    TSUTAYAの入会記念でレンタルビデオが100円で借りれたので、適当に色々と借りてきました。おかげで映画三昧です。さて、「天使にラブソングを」を観て以来、ウーピー・ゴールドバーグのファンなんですが、これでほとんど観終わったかな。内容ですが、いまだに男女差別が残っているウォール街(本当かどうかは知りません)で、がんばって成功するという話をコメディー。ウーピーお得意のストーリーですね。で、そろそろこの展開も食傷気味なので、評価は辛めです。単独で観るならある程度楽しめるかもしれませんが、そろそろ違った映画が観たいです。
- 1998/09/18: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4101096015">檸檬</a>」、梶井 基次郎、新潮文庫
  comment: |-
    表題の作品ではなくて、「桜の樹の下には死体が埋まってる」という話を読みたくて、古本屋で購入。表題の作品は4ページしかないので、すぐに読了。別に面白くなかった。ふーん、そうなのねって感じ。他の作品もパラパラと読んでみたが、琴線に響かなかったので途中で捨てる。大正から昭和初期って面白い作品はほんとうに少ないと思う。
- 1998/09/13: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4806767891">ヒットラーでも死刑にしないの?</a>」、中山 千夏、築地書館
  comment: |-
    法律を勉強しようシリーズ第二段。死刑廃止論を唱えた本です。平易な表現と論理の積み重ねで一般の人にも分かるようになぜ、死刑を廃止するべきなのかを説明しています。そのため、内容の是非は置いといて、書物としての面白さは今イチでした。斜め読みして終わり。
- 1998/09/12: "「タイタニック」"
  comment: サンノゼのFry'sで発売日に購入したビデオ。映画館には足を伸ばさなかったので初めて観たことになります。うー、泣いちまったい。Roseおばあさんがいい味出してますな。最後の無邪気な笑顔が忘れられません。この人の回想という形を取ってるから物語に厚みが出たんだろうな。これなかったら普通のラブ・ロマンスだもん。
- 1998/09/11: 「<a href="https://www.amazon.co.jp/dp/457550680X/">餓狼伝〈8〉</a>」、夢枕 獏、双葉社
  comment: 近所に図書館を発見しました。文庫本至上主義の僕としては、新書、ハードカバーは絶対に購入しません。なので、まだ文庫になる前の本をタダで読める図書館の存在は大きい。内容ですが、相変わらず獏の作品は安定して面白いです。
- 1998/09/03: 「<a href="https://www.amazon.co.jp/dp/4101386129/">殺人鬼</a>」、綾辻 行人、新潮社
  comment: 成田空港から家に戻る途中に暇だったので、本屋で購入。クリスティに触発されて久しぶりに綾辻行人の小説を読みたくなりました。推理小説ってちょっとしたコメントがネタバレにつながるので何も書きませんが、綾辻行人の作品にしては面白くなかった。
- 1998/09/02: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/B0006HBM3Q">BLUES BROTHERS 2000</a>」
  comment: |-
    実は、Chicago loverにも関わらず「Blues Brothers」見てないんですよ。で、続編の「2000」のDVDが売られていたので買って帰ろうと思ったんですが、やっぱり一作目見てからにしようと思いとどまりました。が、帰りの飛行機のPersolnal Videoにあったのでついつい見てしまいました。James Brownとか、Eric Craptonとか、B.B.Kingとか大御所が大量に出演して歌うという豪華な映画でした。
    映画の出来ですが、飛行機内で読んだEntertaiment誌はこう評価していました。「Music:A、Story:D」。僕もそう思います。はい。
- 1998/08/31: 「<a href="https://www.amazon.co.jp/dp/4151300236/">満潮に乗って</a>」、アガサ・クリスティー、早川書房
  comment: 帰りの飛行機用に確保しておいたんだけど読んじゃった。推理物って久しぶりに読んだな。綾辻行人以外の作家だと数年ぶりではなかろうか。ポアロ物です。クリスティの作品の中では50点ぐらいの出来。
- 1998/08/29: 「ロックンロール体操」、ESPN
  comment: |-
    ESPN見てたら、「ロックンロール体操」なる番組をやってました。何かって言うと基本は床体操なんだけど、競技床はライトアップされてるし、選手(女性しか出てなかった)は、レオタードの上に皮ジャン着たり、タキシード着たりしてました。タンクトップの人や、サングラスつけてる人もいた。まあ、競技はじまると危ないので、演技しながらすぐに外しちゃうけど。でも、内容自体は遊びが入ってますが、いわゆる普通の床体操です。演技自体のレベルはすごく高かった。観客は異様にノッてました。スポーツ番組をアメリカ風にショーアップするとこうなりますという見本みたいな番組でしたね。NBAと同じ。
- 1998/08/29: 「<a href="https://www.amazon.co.jp/dp/B0007Z9YAU/">ロリータ</a>」
  comment: "「ロックンロール体操」の後、チャンネル変えたらCATVで映画「ロリータ」やってました。「ロリコン」の語源ですね。ナボコフの書いた小説の方は大学生の時に読んでたので、英語を聞き取れないまでも何とかストーリーにはついていけました。映画全体の雰囲気がすごく良かったので、気に入りました。叙情的な感じがいいね。DVDあったら欲しいな。"
- 1998/08/19: "「Fat Cat」"
  comment: 買いはしませんでしたが、Doverの本屋で太った猫の写真集が売られてました。ブクブクに太った飼い主とのツーショットもあって、微笑ましい半面、ちょっと不気味でした。もうちょっと写真が綺麗だったら購入してたかも。
- 1998/08/16: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4043405014">パラサイト・イヴ</a>」、瀬名 秀明、角川ホラー文庫
  comment: |-
    アメリカ出張に行くので、読み捨ての文庫を近所の古本屋に探しにいったら、この本がありました。流行りも過ぎたしそろそろ読もうかと購入。ええ、天の邪鬼なので流行ってるうちは読みません。500ページもある分厚い本でしたが、成田に向かう電車とバス、シカゴ行きの飛行機の中で一気に読み終えてしまいました。
    出来はかなり良いです。タイトルがtriple meeningなのも素晴らしい。僕はタイトルをつけるのが苦手なので、読んでいる最中に「おお、そういうことか」とウナらせるタイトルには憧れを感じてしまいます。ネタばれになると嫌なので内容は多くは語りませんが、著者は生物学の研究者なので、ホラーにも関わらず3分の2までは非常に論理的に話が進んで行きます。死体から移植臓器を取り出すシーンは恐いっす。
    後半はいわゆるホラーのりで進みます後半の展開は個人的にはあんまり気に食わなかったけど、フィクションとしてはこんなもんかもしれない。おすすめです。他に作品があったら読みたいので、日本に帰ったら調べよう。
- 1998/08/15: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4789708330">TMN EXPOストーリー〈上〉</a>」、藤井 徹貫、CBSソニー出版
  comment: |-
    上記の古本屋で100円で売ってました。一応、復活を望むTMNのファンとして購入。付記しておくと、この時に買った本は、斉藤由貴の詩集(こっちもファンなの)、アガサ・クリスティのポアロもの、船戸与一の再読本の5冊です。藤井徹貫は読みやすいので、買ったその日に読み終えてしまった。
    内容は、TMNのEXPOツアーを同行取材しながら綴ったドキュメンタリーです。読んでると、メンバーのあまりの忙しさ(特に小室哲哉)にああ、売れっ子芸能人って大変なのねと思います。最後の最後でいきなりドラマ自立てになります。下巻が気になる。あの古本屋にはなかったな。新品で買う気はないので、まあ気長にどっかの古本屋でひょっこり出会うのを待ちましょう。
- 1998/08/14: 「<a href="http://www.amazon.co.jp/exec/obidos/ASIN/4041847060">のほほん人間革命</a>」、大槻 ケンヂ、角川書店
  comment: |-
    大槻ケンヂは根が暗黒な人なので、僕好みの作家です。他には、永野のり子とか、押井守とかもそう。今年の頭に大槻ケンヂにハマって、筋肉少女帯のCDと小説を立て続けに聞いて、読んでました。3〜4年前くらいの作品が一番アブラが乗っていますね。最近の作品はいまイチ。
    さて、この本ですが、文庫化されて本屋に並んでいたので、久しぶりに買いました。占い体験記とか、UFOキチへのインタビューとか、SM体験記が書いてあります。しかし、5冊くらい読んでるとそろそろ飽きた。大槻ケンヂは内容の幅が少ないので数冊読むと飽きてきます(すみかわ用語で「ポケットが小さい」という)。精進してください。
- 1998/08/11: 「<a href="https://www.amazon.co.jp/dp/4334726569/">毒猿 新宿鮫〈2〉</a>」、大沢 在昌、光文社
  comment: 新宿鮫シリーズは、新書のときに友人から借りて読んでました。気に入ったので、文庫化を機に購入して、再読。ハードボイルドが良い。月刊アフタヌーンで連載している「地雷震」という漫画が好きな人ならきっと気に入ると思う。ちょっとノリは違うけどね。
